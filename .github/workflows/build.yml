name: Build

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.repository == 'openthread/ot-commissioner' && github.run_id) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  pretty:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap
        run: |
          sudo apt update
          script/bootstrap.sh
          sudo bash script/install-llvm.sh
          sudo apt-get --no-install-recommends install -y shfmt
          python3 -m pip install yapf==0.43.0
          npm install prettier@2.0.4
      - name: Check
        run: |
          script/make-pretty check

  gcc-build:
    name: gcc-${{ matrix.gcc_ver }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        gcc_ver: [5, 6, 7, 8, 9, 10]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install CMake 3.20.1
        run: |
          wget -q https://cmake.org/files/v3.20/cmake-3.20.1-linux-x86_64.tar.gz
          sudo mkdir -p /opt/cmake-3.20.1
          sudo tar -xzf cmake-3.20.1-linux-x86_64.tar.gz --strip-components=1 -C /opt/cmake-3.20.1
          echo "/opt/cmake-3.20.1/bin" >> "$GITHUB_PATH"
          /opt/cmake-3.20.1/bin/cmake --version
      - name: Bootstrap
        run: |
          script/bootstrap.sh
      - name: Build
        run: |
          gcc --version
          mkdir build && cd build
          cmake -GNinja                           \
                -DBUILD_SHARED_LIBS=ON            \
                -DCMAKE_CXX_STANDARD=11           \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON  \
                -DCMAKE_BUILD_TYPE=Release        \
                -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DOT_COMM_WARNING_AS_ERROR=ON     \
                ..
          ninja
          sudo ninja install
          commissioner-cli -v
          ./tests/commissioner-test
          ./tests/commissioner-app-test
          ./tests/job-manager-test
          ./tests/interpreter-test

  clang-build:
    name: clang-${{ matrix.clang_ver }}-${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        clang_ver: [5, 6, 7, 8, 9, 10, 11]
        build_type: ["Debug", "Release"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap
        run: |
          script/bootstrap.sh
      - name: Build
        run: |
          clang --version
          mkdir build && cd build
          cmake -GNinja                                     \
                -DBUILD_SHARED_LIBS=ON                      \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5          \
                -DCMAKE_CXX_STANDARD=11                     \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON            \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DCMAKE_INSTALL_PREFIX=/usr/local           \
                -DOT_COMM_WARNING_AS_ERROR=ON               \
                ..
          ninja
          sudo ninja install
          commissioner-cli -v
          ./tests/commissioner-test
          ./tests/commissioner-app-test
          ./tests/job-manager-test
          ./tests/interpreter-test

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap
        run: |
          script/bootstrap.sh
      - name: Build
        run: |
          mkdir build && cd build
          cmake -G"Unix Makefiles"                 \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DCMAKE_CXX_STANDARD=11            \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON   \
                -DCMAKE_BUILD_TYPE=Release         \
                -DCMAKE_INSTALL_PREFIX=/usr/local  \
                -DOT_COMM_WARNING_AS_ERROR=ON      \
                ..
          make -j2
          sudo make install
          commissioner-cli -v
          ./tests/commissioner-test
          ./tests/commissioner-app-test
          ./tests/job-manager-test
          # macos-15 runners block outbound mDNS due to macOS Local Network
          # Privacy (https://github.com/actions/runner-images/issues/10924).
          ./tests/interpreter-test --gtest_filter=-InterpreterTestSuite.IESV_SingleExportFileMustPass:InterpreterTestSuite.PC_BrScanExport:InterpreterTestSuite.PC_BrScanExportDirAbsent

  android-ndk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r26d
      - name: Bootstrap
        run: |
          script/bootstrap.sh
      - name: Build
        env:
            ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd android
          ANDROID_ABI=armeabi-v7a ./build-commissioner-libs.sh
          ANDROID_ABI=arm64-v8a ./build-commissioner-libs.sh

  java-binding:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r26d
      - name: Bootstrap
        run: |
          script/bootstrap.sh
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir build && cd build
          cmake -GNinja                            \
                -DBUILD_SHARED_LIBS=ON             \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DCMAKE_CXX_STANDARD=11            \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON   \
                -DCMAKE_BUILD_TYPE=Release         \
                -DOT_COMM_JAVA_BINDING=ON          \
                -DOT_COMM_WARNING_AS_ERROR=ON      \
                ..
          ninja

  fmt-format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap
        run: |
          script/bootstrap.sh
      - name: Build
        run: |
          mkdir build && cd build
          cmake -GNinja                            \
                -DBUILD_SHARED_LIBS=ON             \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DCMAKE_CXX_STANDARD=14            \
                -DCMAKE_CXX_STANDARD_REQUIRED=ON   \
                -DCMAKE_BUILD_TYPE=Release         \
                -DCMAKE_INSTALL_PREFIX=/usr/local  \
                -DOT_COMM_WARNING_AS_ERROR=ON      \
                ..
          ninja
